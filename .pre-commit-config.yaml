# Local hooks call the ruff/black installed via `pip install -e ".[dev]"` —
# no network fetch of hook repos, so a clean checkout + `make install` just works.
# Install the git hook with: pre-commit install  (done by `make install`).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint + autofix)
        entry: ruff check --fix
        language: system
        types: [python]
      - id: black
        name: black (format)
        entry: black
        language: system
        types: [python]
