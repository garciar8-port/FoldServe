[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foldserve"
version = "0.1.0"
description = "Distributed ESM-2 protein-model deployment: fine-tune -> multi-GPU serving -> cross-cloud orchestration -> customer-VPC deploy."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rodrigo Garcia" }]
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "accelerate>=0.30",
    "datasets>=2.19",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "black>=24.3",
    "pre-commit>=3.7",
    "pytest>=8.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["foldserve"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
